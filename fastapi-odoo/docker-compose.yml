services:
  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-odoo-user.sql:/docker-entrypoint-initdb.d/init-odoo-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  odoo:
    image: odoo:17.0
    container_name: odoo_erp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: ${ODOO_PG_USER}
      PASSWORD: ${ODOO_PG_PASSWORD}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./docker/odoo/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./docker/odoo/addons:/mnt/extra-addons
    command: >
      odoo
      --db_host=db
      --db_user=${ODOO_PG_USER}
      --db_password=${ODOO_PG_PASSWORD}

volumes:
  postgres_data:
  odoo_data:
