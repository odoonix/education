version: "3.9"

services:
  odoo-db:
    image: postgres:17
    container_name: odoo-db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${ODOO_DB_USERNAME}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD}

    volumes:
      - odoo_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]

      interval: 10s

      timeout: 5s

      retries: 5
  odoo:

    image: odoo:18
    container_name: odoo
    restart: always
    depends_on:
      odoo-db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: ${ODOO_HOST}
      USER: ${ODOO_DB_USERNAME}
      PASSWORD: ${ODOO_DB_PASSWORD}
    command: >
      odoo -i base,sale --without-demo=all -d ${ODOO_DATABASE}
    volumes:
      - odoo_data:/var/lib/odoo
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8069"
        ]

      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  app-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-app}
    volumes:
      - app_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./
    volumes:
      - .:/app
    depends_on:
      odoo:
        condition: service_healthy
      app-db:
        condition: service_healthy
    environment:
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DATABASE}
      ODOO_USERNAME: ${ODOO_USERNAME}
      ODOO_PASSWORD: ${ODOO_PASSWORD}
      DATABASE_URL: postgresql+psycopg2://${DATABASE_USER:-app}:${DATABASE_PASSWORD:-app}@app-db:5432/${DATABASE_NAME}
      RUN_MODE: ${RUN_MODE:-loop}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # restart: unless-stopped
  test-db:
    image: postgres:17
    profiles: ["test"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 10

  tests:
    profiles: ["test"]
    build: ./
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql+psycopg2://app:app@test-db:5432/app_test
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "pip install --no-cache-dir -q -r requirements.txt && pytest --cov=app --cov-report=term-missing -v"


volumes:
  app_db_data:
  odoo_postgres_data:
  odoo_data:

