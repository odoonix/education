services:
  odoo-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:17.0
    depends_on:
      odoo-db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo/config/odoo.conf:/etc/odoo/odoo.conf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/login"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  app-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sync_user
      POSTGRES_PASSWORD: sync_password
      POSTGRES_DB: sync_backend
    ports:
      - "5433:5432"
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync_user -d sync_backend"]
      interval: 5s
      timeout: 5s
      retries: 10


  test-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_backend
    ports:
      - "5434:5432"
    volumes:
      - test_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_backend"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    depends_on:
      odoo:
        condition: service_healthy
      app-db:
        condition: service_healthy
    environment:
      ODOO_URL: http://odoo:8069
      ODOO_DB: exam_db
      ODOO_USERNAME: admin
      ODOO_PASSWORD: admin
      APP_DB_HOST: app-db
      APP_DB_PORT: 5432
      APP_DB_NAME: sync_backend
      APP_DB_USER: sync_user
      APP_DB_PASSWORD: sync_password
    restart: "no"

volumes:
  odoo_db_data:
  odoo_data:
  app_db_data:
  test_db_data: