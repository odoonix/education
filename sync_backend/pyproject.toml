[project]
name = "odoo-sync"
version = "0.1.0"
description = "Single-process Odoo 17 to PostgreSQL synchronization backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.3",
    "pydantic-settings>=2.5.2",
    "sqlalchemy>=2.0.35",
]

[project.scripts]
odoo-sync = "odoo_sync.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast unit tests",
    "integration: PostgreSQL or Docker-backed integration tests",
    "end_to_end: full Dockerized Odoo sync tests",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
