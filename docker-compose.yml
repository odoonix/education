services:

  # ---------- دیتابیس اختصاصی Odoo ----------
  odoo-db:
    image: postgres:15
    container_name: odoo-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- سرور Odoo ----------
  odoo:
    image: odoo:17
    container_name: odoo
    depends_on:
      odoo-db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo_web_data:/var/lib/odoo
      - ./odoo/addons:/mnt/extra-addons
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/login"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- دیتابیس اپلیکیشن Backend خودمون ----------
  app-db:
    image: postgres:15
    container_name: app-db
    environment:
      POSTGRES_DB: syncdb
      POSTGRES_USER: syncuser
      POSTGRES_PASSWORD: syncpass
    ports:
      - "5433:5432"
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncuser -d syncdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- برنامه‌ی Backend پایتون ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: sync-app

    depends_on:
      odoo:
        condition: service_healthy
      app-db:
        condition: service_healthy

    environment:
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB:-my_odoo_project}
      ODOO_USERNAME: ${ODOO_USERNAME:-admin@gmail.com}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-Mohamad@77}

      APP_DB_HOST: app-db
      APP_DB_PORT: "5432"
      APP_DB_NAME: syncdb
      APP_DB_USER: syncuser
      APP_DB_PASSWORD: syncpass

      LOG_LEVEL: INFO
      # کانتینر بعد از اجرای Migration زنده می‌مونه (طبق CMD تو Dockerfile).
      # برای اجرای واقعی Sync، بعد از ساخت دستی دیتابیس Odoo (طبق
      # USER_DOCUMENTATION) این دستور رو بزن:
      #   docker compose exec app python -m src.main

volumes:
  odoo_db_data:
  odoo_web_data:
  app_db_data:
