services:

  # --- Odoo's own database ---
  postgres:
    image: postgres:16
    container_name: odoo_postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- One-shot: create the Odoo database and install Sales ---
  odoo_init:
    image: odoo:17
    container_name: odoo_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: postgres
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo_data:/var/lib/odoo
    command:
      - odoo
      - -d
      - odoo_test
      - -i
      - base,sale_management
      - --without-demo=all
      - --stop-after-init
    restart: "no"

  # --- Odoo server ---
  odoo:
    image: odoo:17
    container_name: odoo_app
    depends_on:
      odoo_init:
        condition: service_completed_successfully
    ports:
      - "8069:8069"
    environment:
      HOST: postgres
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo_data:/var/lib/odoo
    command: ["odoo", "--db-filter=^odoo_test$$"]

  # --- Sync target database ---
  app_db:
    image: postgres:16
    container_name: odoo_app_db
    environment:
      POSTGRES_DB: sync_db
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: sync
    volumes:
      - app_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync -d sync_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- One-shot: seed test data into Odoo ---
  odoo_seed:
    build: .
    container_name: odoo_seed
    depends_on:
      odoo:
        condition: service_started
    environment:
      ODOO_URL: http://odoo:8069
      ODOO_DB_NAME: odoo_test
      ODOO_USERNAME: admin
      ODOO_PASSWORD: admin
    command: ["python", "-m", "scripts.seed_odoo"]
    restart: "no"

  # --- Backend: migrate + run the sync pipeline ---
  backend:
    build: .
    container_name: odoo_backend
    depends_on:
      app_db:
        condition: service_healthy
      odoo_seed:
        condition: service_completed_successfully
    environment:
      DATABASE_NAME: sync_db
      DATABASE_USER: sync
      DATABASE_PASSWORD: sync
      DATABASE_HOST: app_db
      DATABASE_PORT: "5432"
      ODOO_URL: http://odoo:8069
      ODOO_DB_NAME: odoo_test
      ODOO_USERNAME: admin
      ODOO_PASSWORD: admin
    restart: "no"

volumes:
  postgres_data:
  odoo_data:
  app_db_data:
